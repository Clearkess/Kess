<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Transfer Simulator</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main class="phone"><div class="banner">SIMULATED MONEY • NO REAL TRANSFER</div><h1>Flash Transfer Simulator</h1><p>Create a test account, fund simulated money, verify a Nigerian bank account, and send a simulated transfer.</p><div class="card"><h2>Account</h2><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)"><button id="register" class="primary">Create test account</button><p id="msg"></p></div><div class="card"><h2>Already registered?</h2><a href="login.html">Log in</a></div></main><script src="assets/js/api.js"></script><script>document.querySelector('#register').onclick=async()=>{const msg=document.querySelector('#msg');try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:document.querySelector('#name').value,email:document.querySelector('#email').value,password:document.querySelector('#password').value})});localStorage.setItem('sim_token',d.token);localStorage.setItem('sim_user',JSON.stringify(d.user));location.href='wallet.html'}catch(e){msg.textContent=e.message}};</script></body></html>
