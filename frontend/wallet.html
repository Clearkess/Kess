<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main class="phone"><div class="banner">SIMULATED MONEY • NO REAL TRANSFER</div><h1>Wallet</h1><h2 id="balance">₦0.00</h2><input id="fund" type="number" min="1" placeholder="Simulated funding amount"><button id="fundBtn" class="primary">Add simulated funds</button><a href="transfer.html">Send simulated transfer</a><a href="transactions.html">Transactions</a><p id="msg"></p></main><script src="assets/js/api.js"></script><script>async function load(){try{const d=await api('/wallet');balance.textContent='₦'+Number(d.wallet?.balance||0).toLocaleString('en-NG',{minimumFractionDigits:2})}catch(e){msg.textContent=e.message}}fundBtn.onclick=async()=>{try{const d=await api('/wallet/fund-simulated',{method:'POST',body:JSON.stringify({amount:Number(fund.value)})});msg.textContent='Simulated funds added. Ref: '+d.reference;load()}catch(e){msg.textContent=e.message}};if(!localStorage.getItem('sim_token'))location.href='login.html';else load();</script></body></html>
