<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Flash Transfer Simulator</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main class="phone"><div class="banner">SIMULATED MONEY • NO REAL TRANSFER</div><h1>Log in</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login" class="primary">Log in</button><p id="msg"></p><a href="index.html">Create account</a></main><script src="assets/js/api.js"></script><script>document.querySelector('#login').onclick=async()=>{try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});localStorage.setItem('sim_token',d.token);localStorage.setItem('sim_user',JSON.stringify(d.user));location.href='wallet.html'}catch(e){msg.textContent=e.message}};</script></body></html>
