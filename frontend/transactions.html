<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions</title><link rel="stylesheet" href="assets/css/main.css"></head><body><main class="phone"><div class="banner">SIMULATED MONEY • NO REAL TRANSFER</div><h1>Transactions</h1><div id="list"></div><a href="wallet.html">Wallet</a><a href="transfer.html">Send money</a></main><script src="assets/js/api.js"></script><script>(async()=>{if(!localStorage.getItem('sim_token'))return location.href='login.html';try{const d=await api('/transfers/history');list.innerHTML=d.transactions.map(t=>`<div class="card"><b>${t.type}</b><br>₦${Number(t.amount).toLocaleString('en-NG')}<br>${t.accountName||t.description||''}<br><small>${t.reference} • ${t.status}</small></div>`).join('')||'<p>No transactions yet.</p>'}catch(e){list.textContent=e.message}})();</script></body></html>
